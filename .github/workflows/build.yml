name: Zephyr Kernel Build

on:
  workflow_dispatch:
    inputs:
      root:
        description: Root implementation
        required: true
        default: ksu-next
        type: choice
        options:
          - ksu-next
      susfs:
        description: Enable SUSFS
        required: true
        default: true
        type: boolean
      build_ak3:
        description: Package AnyKernel3 ZIP
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: zephyr-kernel-build
  cancel-in-progress: false

env:
  KERNEL_REPO: https://github.com/oplus-mt6895/android_kernel_oplus_mt6895.git
  KERNEL_BRANCH: lineage-24.0
  MODULES_REPO: https://github.com/oplus-mt6895/android_kernel_modules_oplus_mt6895.git
  MODULES_BRANCH: lineage-23.2
  KERNEL_DIR: kernel-5.10
  DEFCONFIG: oplus6895_defconfig

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             git curl ca-certificates python3 python3-pip repo rsync ccache             bc bison flex build-essential libssl-dev libelf-dev pahole             zip unzip

      - name: Notify build started
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          JOB_STATUS: started
        run: python3 scripts/telegram_notify.py started

      - name: Install repo tool
        run: |
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /tmp/repo
          chmod +x /tmp/repo
          sudo mv /tmp/repo /usr/local/bin/repo

      - name: Sync Android kernel build manifest
        run: |
          rm -rf workspace
          mkdir -p workspace
          cd workspace

          # Use our complete manifest directly, like the known-good builder.
          # Do NOT overlay it on AOSP's manifest.
          repo init \
            -u https://github.com/almightygodthor/zephyr-kernel-builder.git \
            -b main \
            -m manifests/zephyr.xml \
            --depth=1

          repo sync -c -j$(nproc --all) \
            --no-tags \
            --no-clone-bundle \
            --force-sync

      - name: Inspect source tree
        run: |
          set -x

          echo "=== kernel directory ==="
          ls -la workspace/kernel-5.10

          echo "=== build config ==="
          ls -l workspace/kernel-5.10/build.config.oplus6895 || true

          echo "=== workspace build.config ==="
          ls -l workspace/build.config || true

          echo "=== defconfig directory ==="
          ls -la workspace/kernel-5.10/arch/arm64/configs | grep -E 'oplus6895|gki_defconfig|mgk_64' || true

          echo "=== kernel HEAD ==="
          git -C workspace/kernel-5.10 rev-parse HEAD

      - name: Limit build config to Image.gz
        working-directory: workspace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build.config")
          s = p.read_text()
          start = s.find('MAKE_GOALS="')
          if start < 0:
              raise SystemExit("MAKE_GOALS block not found")
          end = s.find('\n"', start)
          if end < 0:
              raise SystemExit("MAKE_GOALS block terminator not found")
          new = 'MAKE_GOALS="\nImage.gz\n"\n          # This workflow only produces Image.gz; do not run modules_install.\n          new += '\nIN_KERNEL_MODULES=""\nEXT_MODULES=""\nBUILD_INITRAMFS=""\n'
          p.write_text(s[:start] + new + s[end+2:])
          print(p.read_text().split('MAKE_GOALS="', 1)[1].split('"', 1)[0])
          PY

      - name: Integrate KernelSU-Next and SUSFS
        env:
          SUSFS_ENABLED: ${{ inputs.susfs || 'true' }}
        run: |
          chmod +x scripts/integrate_ksu_susfs.sh
          scripts/integrate_ksu_susfs.sh workspace/kernel-5.10 "${SUSFS_ENABLED}"

      - name: Build Image.gz
        working-directory: workspace
        run: |
          export ROOT_DIR="$PWD"
          export OUT_DIR="$ROOT_DIR/out"
          export BUILD_CONFIG="build.config"
          ulimit -n 65535
          bash build/build.sh

      - name: Package AnyKernel3
        if: ${{ inputs.build_ak3 != false }}
        run: |
          chmod +x scripts/package_ak3.sh
          scripts/package_ak3.sh workspace/kernel-5.10 workspace/out

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-kernel-${{ github.run_number }}
          path: |
            artifacts/*.zip
            artifacts/Image.gz
            artifacts/BUILD_NAME
            artifacts/BUILD_TIME_UTC
          if-no-files-found: error
          retention-days: 14

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/telegram_notify.py "${JOB_STATUS}"
