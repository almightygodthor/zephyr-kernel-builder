name: Zephyr Kernel Build

on:
  workflow_dispatch:
    inputs:
      root:
        description: Root implementation
        required: true
        default: ksu-next
        type: choice
        options:
          - ksu-next
          - none
      susfs:
        description: Enable SUSFS
        required: true
        default: true
        type: boolean
      build_ak3:
        description: Package AnyKernel3 ZIP
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: zephyr-kernel-build
  cancel-in-progress: false

env:
  KERNEL_REPO: https://github.com/oplus-mt6895/android_kernel_oplus_mt6895.git
  KERNEL_BRANCH: lineage-24.0
  MODULES_REPO: https://github.com/oplus-mt6895/android_kernel_modules_oplus_mt6895.git
  MODULES_BRANCH: lineage-23.2
  KERNEL_DIR: kernel-5.10
  DEFCONFIG: oplus6895_defconfig

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl ca-certificates python3 python3-pip repo rsync ccache bc bison flex build-essential libssl-dev libelf-dev pahole zip unzip

      - name: Notify build started
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          JOB_STATUS: started
        run: python3 scripts/telegram_notify.py started

      - name: Install repo tool
        run: |
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /tmp/repo
          chmod +x /tmp/repo
          sudo mv /tmp/repo /usr/local/bin/repo

      - name: Sync Android kernel build manifest
        run: |
          rm -rf workspace
          mkdir -p workspace
          cd workspace
          repo init -u https://github.com/almightygodthor/zephyr-kernel-builder.git -b main -m manifests/zephyr.xml --depth=1
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync

      - name: Inspect source tree
        run: |
          set -x
          echo "=== kernel directory ==="
          ls -la workspace/kernel-5.10
          echo "=== build config ==="
          ls -l workspace/kernel-5.10/build.config.oplus6895
          echo "=== workspace build.config ==="
          ls -l workspace/build.config
          echo "=== defconfig directory ==="
          ls -la workspace/kernel-5.10/arch/arm64/configs | grep -E 'oplus6895|gki_defconfig|mgk_64' || true
          echo "=== kernel HEAD ==="
          git -C workspace/kernel-5.10 rev-parse HEAD
          echo "=== original build config ==="
          sed -n '1,220p' workspace/build.config

      - name: Prepare Image.gz-only build config
        working-directory: workspace
        run: |
          cp -L build.config build.config.zephyr-original
          cat > build.config <<'EOF'
          KERNEL_DIR=kernel-5.10
          . ${ROOT_DIR}/${KERNEL_DIR}/build.config.common
          . ${ROOT_DIR}/${KERNEL_DIR}/build.config.aarch64
          . ${ROOT_DIR}/${KERNEL_DIR}/build.config.lto_thin

          DEFCONFIG=oplus6895_defconfig
          PRE_DEFCONFIG_CMDS="KCONFIG_CONFIG=${ROOT_DIR}/${KERNEL_DIR}/arch/arm64/configs/${DEFCONFIG} ${ROOT_DIR}/${KERNEL_DIR}/scripts/kconfig/merge_config.sh -m -r ${ROOT_DIR}/${KERNEL_DIR}/arch/arm64/configs/gki_defconfig ${ROOT_DIR}/${KERNEL_DIR}/arch/arm64/configs/mgk_64_k510_defconfig ${ROOT_DIR}/${KERNEL_DIR}/kernel/configs/oplus6895.config"
          POST_DEFCONFIG_CMDS="rm ${ROOT_DIR}/${KERNEL_DIR}/arch/arm64/configs/${DEFCONFIG}"

          MAKE_GOALS="
          Image.gz
          "

          FILES="
          arch/arm64/boot/Image.gz
          "

          DTC='${OUT_DIR}/scripts/dtc/dtc'

          IN_KERNEL_MODULES=""
          EXT_MODULES=""
          BUILD_INITRAMFS=""
          EOF

          echo "=== active build.config ==="
          cat build.config

      - name: Integrate KernelSU-Next and SUSFS
        env:
          SUSFS_ENABLED: ${{ inputs.susfs || 'true' }}
        run: |
          chmod +x scripts/integrate_ksu_susfs.sh
          scripts/integrate_ksu_susfs.sh workspace/kernel-5.10 "${{ inputs.root }}" "${SUSFS_ENABLED}"

      - name: Build Image.gz
        working-directory: workspace
        run: |
          export ROOT_DIR="$PWD"
          export OUT_DIR="$ROOT_DIR/out"
          export BUILD_CONFIG="build.config"
          export SKIP_ABI_CHECKS=1
          ulimit -n 65535
          bash build/build.sh

      - name: Verify Image.gz
        working-directory: workspace
        run: |
          test -s out/kernel-5.10/arch/arm64/boot/Image.gz
          echo "Image.gz built successfully:"
          ls -lh out/kernel-5.10/arch/arm64/boot/Image.gz

      - name: Package AnyKernel3
        if: ${{ inputs.build_ak3 != false }}
        run: |
          chmod +x scripts/package_ak3.sh
          scripts/package_ak3.sh workspace/kernel-5.10 workspace/out "${{ inputs.root }}" "${{ inputs.susfs }}"

      - name: Prepare release metadata
        if: ${{ success() && inputs.build_ak3 != false }}
        working-directory: workspace
        env:
          ROOT_IMPL: ${{ inputs.root }}
          SUSFS_ENABLED: ${{ inputs.susfs }}
        run: |
          mkdir -p ../release
          IMAGE="out/kernel-5.10/arch/arm64/boot/Image.gz"
          ZIP="$(find ../artifacts -maxdepth 1 -type f -name "*.zip" -print -quit)"
          test -n "$ZIP" -a -f "$ZIP"
          IMAGE_SHA256="$(sha256sum "$IMAGE" | awk "{print \$1}")"
          ZIP_SHA256="$(sha256sum "$ZIP" | awk "{print \$1}")"
          ZIP_SIZE="$(du -h "$ZIP" | awk "{print \$1}")"
          KSU_COMMIT="$(git -C kernel-5.10/KernelSU-Next rev-parse HEAD 2>/dev/null || echo none)"
          KSU_REF="dev-susfs"
          SUSFS_COMMIT="$(git -C kernel-5.10/susfs4ksu rev-parse HEAD 2>/dev/null || echo disabled)"
          SUSFS_REF="gki-android12-5.10"
          BUILD_TS="$(date -u +%Y%m%d-%H%M%S)"
          TAG="zephyr-run${GITHUB_RUN_NUMBER}"
          RELEASE_TITLE="Zephyr Kernel ${BUILD_TS} — ${ROOT_IMPL}$( [ "$SUSFS_ENABLED" = "true" ] && printf " + SUSFS" )"
          printf "%s\n" "$TAG" > ../release/TAG
          printf "%s\n" "$RELEASE_TITLE" > ../release/TITLE
          printf "%s\n" "$(basename "$ZIP")" > ../release/ZIP_NAME
          printf "%s\n" "$ZIP_SHA256" > ../release/ZIP_SHA256
          printf "%s\n" "$ZIP_SIZE" > ../release/ZIP_SIZE
          printf "%s\n" "$IMAGE_SHA256" > ../release/IMAGE_SHA256
          cat > ../release/RELEASE.md <<EOF
          ## ⚡ Zephyr Kernel — Realme GT Neo 3

          **Device:** Realme GT Neo 3 (`zephyr`)  
          **SoC:** MediaTek MT6895  
          **Kernel:** Linux 5.10  
          **Kernel branch:** `lineage-24.0`

          ### 🔧 Configuration

          - **Root:** `${ROOT_IMPL}`
          - **SUSFS:** `$SUSFS_ENABLED`
          - **AnyKernel3:** `almightygodthor/AnyKernel3`
          - **Build:** GitHub Actions #${GITHUB_RUN_NUMBER}

          ### 📦 Kernel ZIP

          **File:** `$(basename "$ZIP")`  
          **Size:** `$ZIP_SIZE`  
          **SHA256:** `$ZIP_SHA256`

          ### 🧩 Image.gz

          **SHA256:** `$IMAGE_SHA256`

          ### 🌳 KernelSU-Next

          **Integration ref:** `$KSU_REF`  
          **Commit:** `$KSU_COMMIT`  
          **Manager:** https://github.com/KernelSU-Next/KernelSU-Next/releases

          ### 🛡 SUSFS

          **Integration ref:** `$SUSFS_REF`  
          **Commit:** `$SUSFS_COMMIT`  
          **Module:** https://github.com/sidex15/susfs4ksu-module/releases
          EOF

      - name: Create GitHub Release
        if: ${{ success() && inputs.build_ak3 != false }}
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release
        run: |
          ZIP="../artifacts/$(cat ZIP_NAME)"
          TAG_VALUE="$(cat TAG)"
          ZIP_NAME_VALUE="$(cat ZIP_NAME)"
          gh release create "$TAG_VALUE" "$ZIP" "../artifacts/Image.gz" \
            --title "$(cat TITLE)" \
            --notes-file RELEASE.md

          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG_VALUE}"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_VALUE}/${ZIP_NAME_VALUE}"
          echo "RELEASE_URL=$RELEASE_URL" >> "$GITHUB_ENV"
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$ZIP_NAME_VALUE" >> "$GITHUB_ENV"
          echo "ARTIFACT_SIZE=$(cat ZIP_SIZE)" >> "$GITHUB_ENV"
          echo "ARTIFACT_SHA256=$(cat ZIP_SHA256)" >> "$GITHUB_ENV"

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-kernel-${{ github.run_number }}
          path: |
            artifacts/*.zip
            artifacts/Image.gz
            artifacts/BUILD_NAME
            artifacts/BUILD_TIME_UTC
          if-no-files-found: error
          retention-days: 14

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
          ROOT_IMPL: ${{ inputs.root }}
          SUSFS_ENABLED: ${{ inputs.susfs }}
          RELEASE_URL: ${{ env.RELEASE_URL }}
          ARTIFACT_NAME: ${{ env.ARTIFACT_NAME }}
          ARTIFACT_SIZE: ${{ env.ARTIFACT_SIZE }}
          ARTIFACT_SHA256: ${{ env.ARTIFACT_SHA256 }}
        run: python3 scripts/telegram_notify.py "${JOB_STATUS}"
